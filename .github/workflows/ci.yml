name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same branch are cancelled; main is exempt so every
# merged commit keeps a completed status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # Report every runner's result rather than cancelling siblings on the
      # first failure; a version-specific break is the point of the matrix.
      fail-fast: false
      matrix:
        # Both are Apple Silicon. macos-15 pairs with Xcode 16.x, macos-26
        # with Xcode 26.x, so the matrix covers two Swift toolchains.
        runner: [macos-15, macos-26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          sw_vers
          echo "Architecture: $(uname -m)"
          xcodebuild -version
          swift --version

      - name: Build (debug, including tests)
        run: swift build --build-tests

      - name: Run tests
        run: swift test --skip-build

      - name: Build (release)
        run: swift build -c release
