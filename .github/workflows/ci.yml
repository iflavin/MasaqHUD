name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded runs on the same branch are cancelled; main is exempt so every
# merged commit keeps a completed status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # Report every runner's result rather than cancelling siblings on the
      # first failure; a version-specific break is the point of the matrix.
      fail-fast: false
      matrix:
        # All Apple Silicon, spanning the supported macOS range: macos-14 is
        # the floor (Xcode 15.x), macos-26 the newest (Xcode 26.x), with
        # macos-15 (Xcode 16.x) between them. The package is installed via a
        # Homebrew formula that builds from source, so it must compile on every
        # toolchain a supported user might have, not just the newest.
        runner: [macos-14, macos-15, macos-26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          sw_vers
          echo "Architecture: $(uname -m)"
          xcodebuild -version
          swift --version

      - name: Build (debug, including tests)
        run: swift build --build-tests

      - name: Run tests
        run: swift test --skip-build

      - name: Build (release)
        run: swift build -c release
